<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPath ಕಲಿಕೆ — Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wa-bg:#0b141a; --wa-head:#1f2c34; --wa-in:#202c33; --wa-out:#005c4b;
  --green:#25D366; --navy:#15356b; --gold:#f5a623; --green2:#3dbe56;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Plus Jakarta Sans','Noto Sans Kannada',sans-serif;
  background:linear-gradient(160deg,#0e2547,#15356b);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px;color:#fff;
}
.kn{font-family:'Noto Sans Kannada',sans-serif}
.demo-head{text-align:center;margin-bottom:20px}
.demo-head h1{font-size:24px;font-weight:800}
.demo-head h1 .g{color:var(--green2)}
.demo-head p{font-size:14px;opacity:.8;margin-top:4px}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,.2);border:1px solid var(--green);color:var(--green2);padding:4px 14px;border-radius:30px;font-size:12px;font-weight:700;margin-bottom:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

/* PHONE */
.phone{
  width:370px;max-width:94vw;height:680px;max-height:78vh;
  background:#000;border-radius:36px;padding:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;
}
.screen{background:var(--wa-bg);height:100%;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
/* wa background pattern */
.screen::before{content:"";position:absolute;inset:0;opacity:.04;
  background-image:radial-gradient(circle at 20% 30%,#fff 1px,transparent 1px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}

.wa-header{background:var(--wa-head);padding:14px 14px;display:flex;align-items:center;gap:12px;z-index:2}
.wa-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--green2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.wa-name{font-size:15px;font-weight:700}
.wa-status{font-size:11px;color:var(--green2)}
.wa-header .back{font-size:20px;opacity:.7}

.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;z-index:1;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}

.msg{max-width:82%;padding:8px 11px;border-radius:10px;font-size:13.5px;line-height:1.5;animation:pop .3s ease;position:relative;white-space:pre-wrap}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--wa-in);align-self:flex-start;border-top-left-radius:3px}
.msg.user{background:var(--wa-out);align-self:flex-end;border-top-right-radius:3px}
.msg .time{font-size:9px;opacity:.5;float:right;margin:6px 0 -2px 8px}
.msg b{color:#fff;font-weight:700}
.msg .ttl{color:var(--green2);font-weight:700}

/* option buttons (list style) */
.opts{align-self:flex-start;width:82%;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.opt{
  background:var(--wa-in);border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:11px 14px;font-size:13.5px;cursor:pointer;color:#7cc6ff;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;transition:.15s;
  animation:pop .3s ease;
}
.opt:hover{background:#2a3942;border-color:var(--green)}
.opt:active{transform:scale(.98)}
.opt .arr{opacity:.4;font-size:12px}

.typing{align-self:flex-start;background:var(--wa-in);border-radius:10px;padding:12px 16px;display:flex;gap:4px;border-top-left-radius:3px}
.typing span{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

.restart{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;border:none;padding:10px 24px;border-radius:30px;
  font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(37,211,102,.4);
  display:none;z-index:5;font-family:inherit;
}

.hint{text-align:center;margin-top:18px;font-size:13px;opacity:.7;max-width:370px}
.hint b{color:var(--green2)}
.cta{margin-top:16px}
.cta a{background:var(--green);color:#fff;text-decoration:none;padding:12px 26px;border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;box-shadow:0 8px 24px rgba(37,211,102,.35)}
</style>
</head>
<body>

<div class="demo-head">
  <div class="live-badge"><span class="live-dot"></span> LIVE DEMO</div>
  <h1>Smart<span class="g">Path</span> ಕಲಿಕೆ — ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತೆ?</h1>
  <p>👇 Button tap ಮಾಡಿ ನೋಡಿ — ನಿಜವಾದ WhatsApp ತರಹ!</p>
</div>

<div class="phone">
  <div class="screen">
    <div class="wa-header">
      <span class="back">‹</span>
      <div class="wa-avatar">🎓</div>
      <div><div class="wa-name">SmartPath ಕಲಿಕೆ</div><div class="wa-status">online</div></div>
    </div>
    <div class="chat" id="chat"></div>
    <button class="restart" id="restart" onclick="start()">🔄 ಮತ್ತೆ ಶುರು ಮಾಡಿ</button>
  </div>
</div>

<div class="hint">
  ಇದು <b>demo</b> ಮಾತ್ರ. ನಿಜವಾದ bot ನಲ್ಲಿ — Notes, Q&A, Quiz, Writing Evaluation, AI Doubt ಎಲ್ಲ ಇದೆ!
</div>
<div class="cta">
  <a href="https://wa.me/917019068606" target="_blank">📱 ನಿಜವಾದ bot ಶುರು ಮಾಡಿ</a>
</div>

<script>
const chat = document.getElementById('chat');
const restart = document.getElementById('restart');
let busy = false;

function time(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function scroll(){chat.scrollTop = chat.scrollHeight;}

function userMsg(text){
  const m=document.createElement('div');m.className='msg user';
  m.innerHTML=text+'<span class="time">'+time()+' ✓✓</span>';
  chat.appendChild(m);scroll();
}
function botMsg(html){
  return new Promise(res=>{
    const t=document.createElement('div');t.className='typing';
    t.innerHTML='<span></span><span></span><span></span>';
    chat.appendChild(t);scroll();
    setTimeout(()=>{
      t.remove();
      const m=document.createElement('div');m.className='msg bot';
      m.innerHTML=html+'<span class="time">'+time()+'</span>';
      chat.appendChild(m);scroll();res();
    },700);
  });
}
function options(opts){
  const box=document.createElement('div');box.className='opts';
  opts.forEach(o=>{
    const b=document.createElement('div');b.className='opt';
    b.innerHTML='<span>'+o.label+'</span><span class="arr">▶</span>';
    b.onclick=()=>{if(busy)return;busy=true;document.querySelectorAll('.opts').forEach(x=>x.remove());userMsg(o.label);o.next();};
    box.appendChild(b);
  });
  chat.appendChild(box);scroll();busy=false;
}

// ---------- FLOW ----------
async function start(){
  chat.innerHTML='';restart.style.display='none';busy=false;
  await botMsg('🙏 ನಮಸ್ಕಾರ! <b>SmartPath ಕಲಿಕೆ</b> ಗೆ ಸ್ವಾಗತ.\nKSEEB 8-10 ಗೆ ನಿಮ್ಮ AI ಶಿಕ್ಷಕ! 📚');
  await botMsg('<span class="ttl">📋 Main Menu</span>\nಯಾವ ವಿಷಯ ಕಲಿಯೋಣ?');
  options([
    {label:'📐 ಗಣಿತ Maths', next:partMenu},
    {label:'🔬 ವಿಜ್ಞಾನ Science', next:()=>partMenu()},
    {label:'📊 My Progress', next:progress},
  ]);
}

async function partMenu(){
  await botMsg('<span class="ttl">📐 Maths</span>\nಯಾವ Part?');
  options([
    {label:'Part 1', next:chapterMenu},
    {label:'Part 2', next:()=>chapterMenu()},
  ]);
}

async function chapterMenu(){
  await botMsg('<span class="ttl">📖 Maths Part 1 — Chapters</span>\nChapter ಆರಿಸಿ:');
  options([
    {label:'Ch 1 — ಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು', next:chapterContent},
    {label:'Ch 2 — Linear Equations', next:()=>chapterContent()},
  ]);
}

async function chapterContent(){
  await botMsg('<span class="ttl">📘 Chapter 1: ಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು</span>\nಏನು ಬೇಕು?');
  options([
    {label:'📖 Notes', next:notes},
    {label:'❓ Q&A', next:()=>qa()},
    {label:'📝 Quiz', next:()=>quiz()},
    {label:'📋 Topics', next:()=>topics()},
  ]);
}

async function notes(){
  await botMsg('<span class="ttl">📖 Notes — ಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು</span>\n\n<b>Definition:</b>\np/q ರೂಪದಲ್ಲಿ ಬರೆಯಬಹುದಾದ ಸಂಖ್ಯೆಯನ್ನು ಪರಿಮೇಯ ಸಂಖ್ಯೆ ಎನ್ನುತ್ತೇವೆ (q≠0).\n\n<b>Key Points:</b>\n• ಪೂರ್ಣಾಂಕಗಳು ಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು\n• 0 ಸಹ ಪರಿಮೇಯ ಸಂಖ್ಯೆ\n• ಉದಾ: 3/4, -5, 0.5');
  await afterContent();
}
async function qa(){
  await botMsg('<span class="ttl">❓ Q&A — 2 Marks</span>\n\n<b>Q:</b> ಪರಿಮೇಯ ಸಂಖ್ಯೆ ಎಂದರೇನು? ಎರಡು ಉದಾಹರಣೆ ಕೊಡಿ.\n\n<b>A:</b> p/q ರೂಪದ ಸಂಖ್ಯೆ (q≠0). ಉದಾ: 3/4, 7/2');
  await afterContent();
}
async function quiz(){
  await botMsg('<span class="ttl">📝 Quiz ಶುರು!</span>\n\n<b>Q1:</b> ಈ ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ಪರಿಮೇಯ ಸಂಖ್ಯೆ?');
  options([
    {label:'A) √2', next:()=>quizWrong()},
    {label:'B) 3/4', next:()=>quizRight()},
    {label:'C) π', next:()=>quizWrong()},
  ]);
}
async function quizRight(){
  await botMsg('✅ <b>ಸರಿ ಉತ್ತರ!</b>\n3/4 ಒಂದು ಪರಿಮೇಯ ಸಂಖ್ಯೆ. 🎉\n\n⭐ Score: 1/1\nಚೆನ್ನಾಗಿ ಮಾಡಿದ್ರಿ!');
  await afterContent();
}
async function quizWrong(){
  await botMsg('❌ <b>ತಪ್ಪು ಉತ್ತರ.</b>\nಸರಿ ಉತ್ತರ: B) 3/4\n(√2, π — ಅಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು)\n\n📚 ಮತ್ತೆ try ಮಾಡಿ!');
  await afterContent();
}
async function topics(){
  await botMsg('<span class="ttl">📋 Topics</span>\nTopic ಆರಿಸಿ:');
  options([
    {label:'1.1 Introduction', next:()=>notes()},
    {label:'1.2 Properties + ✏️ Evaluation', next:()=>evalDemo()},
  ]);
}

async function evalDemo(){
  await botMsg('<span class="ttl">✏️ Writing Evaluation</span> 💎\nಯಾವ ಪ್ರಶ್ನೆಗೆ answer ಬರೀತೀರಾ?');
  options([
    {label:'Q: Closure property ಎಂದರೇನು?', next:evalAsk},
  ]);
}
async function evalAsk(){
  await botMsg('✏️ <b>Q [3 marks]:</b> Closure property ಎಂದರೇನು? ಉದಾಹರಣೆ ಕೊಡಿ.\n\n👇 ನಿಮ್ಮ answer ಬರೆಯಿರಿ:');
  options([
    {label:'✍️ (Student answer ಬರೆಯುತ್ತಾರೆ)', next:evalResult},
  ]);
}
async function evalResult(){
  await botMsg('⏳ ನಿಮ್ಮ answer evaluate ಮಾಡ್ತಿದೀನಿ...');
  await botMsg('<span class="ttl">✏️ EVALUATION RESULT</span>\n⭐⭐⭐ (70%)\n━━━━━━━━━━\n\n🎯 <b>MARKS: 2/3</b>\n\n✅ <b>ಚೆನ್ನಾಗಿ ಬರೆದಿದ್ದು:</b>\n• Closure concept ಸರಿ ಇದೆ\n\n📌 <b>ಸೇರಿಸಬೇಕಾಗಿದ್ದು:</b>\n• ಉದಾಹರಣೆ ಸ್ಪಷ್ಟ ಇಲ್ಲ\n\n🔤 <b>Spelling:</b> Error rate 10%\n• "additon" → "addition"\n\n✍️ <b>Grammar:</b> Error rate 0% ✅\n\n💡 <b>Model Answer:</b>\nಪರಿಮೇಯ ಸಂಖ್ಯೆಗಳು ಸಂಕಲನದ ಅಡಿಯಲ್ಲಿ ಮುಚ್ಚಲ್ಪಟ್ಟಿವೆ...\n\n🌟 Spelling ಸರಿ ಮಾಡಿದ್ರೆ ಪೂರ್ಣ marks!');
  await afterContent();
}

async function progress(){
  await botMsg('<span class="ttl">📊 ನಿಮ್ಮ Progress</span>\n⭐⭐⭐⭐ Good! (78%)\n\n📝 ಒಟ್ಟು Quiz: 12\n🔥 Streak: 5 ದಿನ\n\n📐 Maths: 82%\n🔬 Science: 74%\n\n🏆 Best: Maths Ch1 (82%)\n⚠️ Improve: Science Ch3\n\n✏️ Writing: 15 answers, 72%');
  await afterContent();
}

async function afterContent(){
  await botMsg('ಮುಂದೇನು? 👇');
  options([
    {label:'🏠 Main Menu ಗೆ ಹೋಗಿ', next:()=>{ mainAgain(); }},
    {label:'✅ Demo ಮುಗಿಸಿ', next:()=>{ finish(); }},
  ]);
}
async function mainAgain(){
  await botMsg('<span class="ttl">📋 Main Menu</span>\nಯಾವ ವಿಷಯ?');
  options([
    {label:'📐 ಗಣಿತ Maths', next:partMenu},
    {label:'🔬 ವಿಜ್ಞಾನ Science', next:()=>partMenu()},
    {label:'📊 My Progress', next:progress},
  ]);
}
async function finish(){
  await botMsg('🎉 Demo ಮುಗಿತು!\n\nಇದು ಒಂದು ಸಣ್ಣ demo ಮಾತ್ರ. ನಿಜವಾದ bot ನಲ್ಲಿ:\n✅ ಎಲ್ಲ chapters, topics\n✅ ಸಾವಿರಾರು Q&A + Quiz\n✅ AI Doubt Solving\n✅ Parent Reports\n\n📱 ಈಗಲೇ ಶುರು ಮಾಡಿ — 2 ದಿನ FREE!');
  restart.style.display='block';scroll();
}

start();
</script>
</body>
</html>
